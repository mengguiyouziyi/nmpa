# 请求重放引擎配置 - 基于真实用户请求的技术方案
mode: request_replayer
output_dir: outputs

# 基础配置
headless: true
max_retries: 3
request_delay: 2

# 爬取参数
max_pages: 2
page_size: 10

# 任务配置
jobs:
  - dataset: domestic
    code_prefix: 国药准字H
    max_pages: 2
    page_size: 10

  - dataset: domestic
    code_prefix: 国药准字S
    max_pages: 1
    page_size: 10

# 导出配置
export:
  formats: [excel, json]
  include_raw: true

# 请求重放特定配置
request_replayer:
  # 捕获请求配置
  capture_timeout: 30  # 捕获请求的超时时间（秒）
  max_capture_attempts: 3  # 最大捕获尝试次数

  # 用户行为模拟配置
  user_simulation:
    random_scroll_count: 3  # 随机滚动次数
    scroll_delay_range: [1, 3]  # 滚动延迟范围（秒）
    mouse_move_delay: 0.5  # 鼠标移动延迟（秒）
    typing_delay: 1  # 输入延迟（秒）

  # 搜索测试关键词
  test_search_queries:
    - "国药准字H"
    - "药品"
    - "NMPA"

  # 浏览器配置
  browser:
    window_size: [1920, 1080]
    random_user_agent: true

  # 请求分析配置
  analysis:
    enable_pattern_analysis: true  # 启用请求模式分析
    sign_cache_size: 100  # 签名缓存大小
    max_cache_age: 3600  # 缓存最大年龄（秒）