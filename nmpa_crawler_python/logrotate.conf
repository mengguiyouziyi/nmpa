# NMPA Python爬虫日志轮转配置
# 使用方法: logrotate -f logrotate.conf

/path/to/nmpa_crawler_python/logs/crawler_*.log {
    daily                    # 每天轮转一次
    missingok               # 如果日志文件不存在，不报错
    rotate 30               # 保留30天的日志
    compress                # 压缩旧日志文件
    delaycompress           # 延迟压缩（保留最新的未压缩日志）
    notifempty              # 如果日志文件为空，不轮转
    create 644 $USER $USER  # 创建新日志文件，权限644

    # 轮转后的文件名格式
    olddir /path/to/nmpa_crawler_python/logs/archive

    # 大小限制 - 如果日志文件超过100MB，立即轮转
    size 100M

    # 自定义轮转脚本
    postrotate
        # 发送通知（可选）
        # echo "NMPA爬虫日志已轮转: $(date)" | mail -s "日志轮转通知" admin@example.com

        # 清理超过90天的压缩日志
        find /path/to/nmpa_crawler_python/logs/archive -name "*.gz" -mtime +90 -delete
    endscript
}

# 错误日志单独配置
/path/to/nmpa_crawler_python/logs/error_*.log {
    daily
    missingok
    rotate 60              # 错误日志保留更长时间
    compress
    delaycompress
    notifempty
    create 644 $USER $USER
    olddir /path/to/nmpa_crawler_python/logs/archive
    size 50M               # 错误日志文件大小限制更小
}